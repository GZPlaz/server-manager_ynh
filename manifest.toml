#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "server-manager"
name = "Server Manager"
description.en = "Web file manager and terminal to browse, edit, upload and download the files of your server, like FileZilla"
description.fr = "Gestionnaire de fichiers et terminal web pour parcourir, éditer, envoyer et télécharger les fichiers de votre serveur"

version = "1.1.1~ynh1"

maintainers = ["GZPlaz"]

[upstream]
license = "MIT"
code = "https://github.com/GZPlaz/server-manager_ynh"

[integration]
yunohost = ">= 12.0.9"
helpers_version = "2.1"
architectures = "all"
multi_instance = true
ldap = "not_relevant"
sso = true
disk = "1M"
ram.build = "10M"
ram.runtime = "40M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/files"

    [install.root_path]
    ask.en = "Which folder should the file manager give access to?"
    ask.fr = "À quel dossier le gestionnaire de fichiers doit-il donner accès ?"
    help.en = "Use / to manage every file of the server. Users of the app can't go above this folder."
    help.fr = "Utilisez / pour gérer tous les fichiers du serveur. Les utilisateurs de l'app ne peuvent pas remonter au-dessus de ce dossier."
    type = "string"
    default = "/"
    pattern.regexp = '^/[^"\\%]*$'
    pattern.error = "Must be an absolute path (starting with /), without quotes, backslashes or % characters."

    [install.full_access]
    ask.en = "Give the file manager full (root) access to the server?"
    ask.fr = "Donner un accès complet (root) au serveur au gestionnaire de fichiers ?"
    help.en = "Needed to edit system files such as those in /etc. If disabled, the app runs as its own system user and can only change the files that this user is allowed to change. Only the 'admins' group can use the app by default."
    help.fr = "Nécessaire pour modifier des fichiers système comme ceux de /etc. Si désactivé, l'app tourne avec son propre utilisateur système et ne peut modifier que les fichiers autorisés pour cet utilisateur. Par défaut, seul le groupe 'admins' peut utiliser l'app."
    type = "boolean"
    default = true

    [install.terminal]
    ask.en = "Enable the web terminal?"
    ask.fr = "Activer le terminal web ?"
    help.en = "A shell in the browser to run commands on the server, like over SSH. With full access, it is a root shell. Only the 'admins' group can use it by default (permission 'Terminal')."
    help.fr = "Un shell dans le navigateur pour exécuter des commandes sur le serveur, comme en SSH. Avec l'accès complet, c'est un shell root. Par défaut, seul le groupe 'admins' peut l'utiliser (permission 'Terminal')."
    type = "boolean"
    default = true

[resources]
    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"
    # Managing the server's files is an administration task: only admins by
    # default, and the app can never be opened to anonymous visitors.
    main.allowed = "admins"
    main.protected = true
    # Who can open the web terminal (a root shell with full access)
    terminal.url = "/api/terminal"
    terminal.show_tile = false
    terminal.allowed = "admins"
    terminal.protected = true

    [resources.ports]

    [resources.apt]
    packages = "python3"
